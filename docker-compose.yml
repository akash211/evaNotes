services:
  evanotes:
    image: akashkece/evanotes:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evanotes
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - EVA_DATA_DIR=/data
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Telegram reminders (optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # AI rewrite assistant (optional — any OpenAI-compatible API)
      - AI_API_BASE=${AI_API_BASE:-https://openrouter.ai/api/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODELS=${AI_MODELS:-openai/gpt-6-luna,z-ai/glm-5.3-flash,nvidia/nemotron-3.5-super-vl:free,openai/gpt-5.6-luna}
      - AI_DEFAULT_MODEL=${AI_DEFAULT_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      # Version history tuning
      - VERSION_MIN_INTERVAL_SECS=${VERSION_MIN_INTERVAL_SECS:-900}
      - VERSION_MAX_KEEP=${VERSION_MAX_KEEP:-10}
      - OTP_RATE_LIMIT_MAX=${OTP_RATE_LIMIT_MAX:-5}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - eva-data:/data

volumes:
  eva-data:
    driver: local
